version: '3.5'

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    network_mode: host
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: '200MB'

  api1:
    build: .
    network_mode: host
    environment:
      - DATABASE_URL=postgres://admin:admin@localhost:5432/rinha
      - PORT=8001
    command: uvicorn app:app --host 127.0.0.1 --port 8001 --workers 2
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: '700MB'

  api2:
    build: .
    network_mode: host
    environment:
      - DATABASE_URL=postgres://admin:admin@localhost:5432/rinha
      - PORT=8002
    command: uvicorn app:app --host 127.0.0.1 --port 8002 --workers 2
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: '700MB'

  db:
    image: postgres:16-alpine
    network_mode: host
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=rinha
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c max_connections=100 -c shared_buffers=512MB -c synchronous_commit=off -c fsync=off -c full_page_writes=off
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: '1400MB'
